/**:
  ros__parameters:
    # Map params for Livox bots (NODE_LIVOX_LIDAR=1). Same defaults as kiwi_map.yaml
    # for now — diverge here if lidar needs a larger window / different fusion.
    # Selected by elevation_mapping.launch.py unless EM_CPU_MAP_FILE overrides.
    min_update_rate: 5.0
    time_tolerance: 0.5
    # Per-input height gating lives under <input>.sensor_processor in
    # robots/kiwi_3d_lidar.yaml (e.g. livox.sensor_processor.ignore_points_above).
    robot_motion_map_update/covariance_scale: 0.0
    robot_motion_map_update/covariance_scale_translation_x: 0.0
    robot_motion_map_update/covariance_scale_translation_y: 0.0
    robot_motion_map_update/covariance_scale_translation_z: 0.0
    robot_motion_map_update/covariance_scale_rotation_x: 0.0
    robot_motion_map_update/covariance_scale_rotation_y: 0.0
    robot_motion_map_update/covariance_scale_rotation_z: 0.0

    length_in_x: 6.3
    length_in_y: 4.9
    position_x: 0.0
    position_y: 0.0
    resolution: 0.07
    min_variance: 0.0001
    max_variance: 0.002 #reduced from 0.05 to theoretically fastest cleaning.
    mahalanobis_distance_threshold: 1.5
    multi_height_noise: 0.001
    fused_map_publishing_rate: 0.0
    enable_visibility_cleanup: true
    visibility_cleanup_rate: 1.0
    scanning_duration: 0.1
